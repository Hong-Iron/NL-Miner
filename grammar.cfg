# --------------------------------------------------------------------------- #
# NL-Miner English constituency grammar  (Phase 2, phase2_parsers.md §2.1)    #
#                                                                             #
# Form:   LHS -> RHS...  [weight]                                             #
#   * RHS is 1 or 2 symbols (NF2 — binarised by cky.binarize on load; new    #
#     trinary rules are also accepted and split into synthetic <L~k> nodes).  #
#   * weight is an optional trailing float (hand constant, §2.2); missing   #
#     → 1.0. Higher weight = preferred when a chart cell is ambiguous; the    #
#     score(rule, span) interface in cky.py sums them to rank trees and is    #
#     PCFG-replaceable.                                                      #
#   * '#' starts a comment (only outside rule symbols).                      #
#                                                                             #
# Preterminals are the POS tags emitted by src/postagger (DT/IN/NN/NNS/NNP/   #
# JJ/VB/VBD/VBP/VBZ/VBN/VBG/MD/RB/PRP/PRP$/CC/CD/WP/WDT/EX). The chart's     #
# base cells are filled with those tags; phrase rules combine them upward.    #
# Verbs that the rule tagger does not recognise (irregular pasts, bare main  #
# verbs) are tagged NN/NNS and therefore will not project into a VP — a known, #
# documented limitation of the no-LM rule tagger (§2.4), not of this grammar. #
# --------------------------------------------------------------------------- #

START  S

# ---- Clause ----------------------------------------------------------------
S    -> NP VP                1.0      # canonical declarative
S    -> VP                   0.6      # imperative / pro-drop
S    -> S CC S               0.4      # clausal coordination
S    -> NP VP PP             0.5      # subject + verb + trailing PP (binarised)

# ---- Noun phrase -----------------------------------------------------------
NP   -> PRP                  0.9
NP   -> NNP NNP              0.7
NP   -> DT NN                1.0      # "the dog"
NP   -> DT NNS               0.8      # "the dogs"
NP   -> DT NNP               0.8      # "the London"
NP   -> DT JJ                0.3      # "the rich"
NP   -> DT NP                0.2      # "the most fascinating creatures" chain
NP   -> JJ NP                0.4      # stacked adjectives
NP   -> JJ NN                0.9      # "big dog"
NP   -> JJ NNS               0.8
NP   -> RB NP                0.3      # "most fascinating creatures"
NP   -> NN NN                0.5      # noun-noun compound
NP   -> NN NNS               0.5
NP   -> NNS                  0.7      # bare plural
NP   -> NN                   0.7      # bare mass / singular
NP   -> NNP                  0.7      # proper-noun singleton
NP   -> PRP$ NP              0.7
NP   -> CD NP                0.6      # "two sharks"
NP   -> CD NNS               0.5
NP   -> NP PP                0.8      # PP attaches to NP
NP   -> NP CC NP             0.4
NP   -> WP                   0.5      # "what" as NP

# ---- Verb phrase -----------------------------------------------------------
VP   -> VBD                  0.7      # intransitive
VP   -> VB                   0.7
VP   -> VBZ                  0.7
VP   -> VBP                  0.7
VP   -> VBD NP               1.0      # transitive
VP   -> VB  NP               1.0
VP   -> VBZ NP               1.0
VP   -> VBP NP               1.0
VP   -> VBD PP               0.8      # verb + PP
VP   -> VB  PP               0.8
VP   -> VBZ PP               0.8
VP   -> VBP PP               0.8
VP   -> VBD ADJP              0.6      # copula + adjective ("was cold")
VP   -> VB  ADJP              0.6
VP   -> VBZ ADJP              0.6
VP   -> VBP ADJP              0.6
VP   -> VBD SBAR              0.4
VP   -> VB  SBAR              0.4
VP   -> VBZ SBAR              0.4
VP   -> VBP SBAR              0.4
VP   -> VBN NP                0.6      # passive participle
VP   -> VBN PP                0.5
VP   -> VBG NP                0.6      # gerund/progressive
VP   -> VBG PP                0.5
VP   -> MD VP                 0.8      # modal + VP
VP   -> VP PP                 0.7      # PP attaches to VP
VP   -> VP CC VP              0.4
VP   -> VP RB                 0.3      # post-verbal adverb

# ---- Prepositional phrase --------------------------------------------------
PP   -> IN NP                1.0

# ---- Subordinate clause (light, per CONSTITUENCY_DEPENDENCY §1) ------------
SBAR -> IN S                 0.6
SBAR -> NP VP                0.3      # "the fox jumps" embedded (light)

# ---- Adjective / Adverb phrases --------------------------------------------
ADJP -> JJ                   0.9
ADJP -> RB JJ                0.7      # "very quick"
ADJP -> JJ JJ                0.4
ADJP -> ADJP CC ADJP          0.3
ADVP -> RB                   0.8
